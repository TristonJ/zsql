[package]
name = "zsql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "zsql"

[[bin]]
name = "zsql"
path = "src/main.rs"

[dependencies]
# zsql-postgres is intentionally not a dependency here: this binary currently
# renders `ui::results::ResultsView` from a hardcoded `zsql_core::ResultSet`
# with no live connection or `Session`, so nothing in this crate calls into
# the Postgres driver yet. Add it back once a real `Session` runs queries
# against a connection and feeds their results into the grid.
zsql-core = { path = "../zsql-core" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
gpui = { workspace = true }

[dev-dependencies]
# Enables `gpui::test` / `TestAppContext` (gpui's headless, deterministic test
# harness) for the render-smoke test in `ui::results`. Unified with the
# `gpui` dependency above via Cargo's resolver, so this only takes effect for
# test/bench builds, not the shipped binary.
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
