[package]
name = "zsql"
version = "0.0.0"
description = "A fast, lightweight desktop SQL editor."
edition.workspace = true
license.workspace = true
publish = false
default-run = "zsql"

[[bin]]
name = "zsql"
path = "src/main.rs"

[dependencies]
zsql-core = { path = "../zsql-core" }
# `drivers.rs` registers both of these behind `zsql_core::Driver` and selects
# between them purely via `zsql_core::select_driver`; neither crate's own
# types (sqlx or otherwise) are named outside their own crates.
zsql-postgres = { path = "../zsql-postgres" }
zsql-sqlite = { path = "../zsql-sqlite" }
zsql-mssql = { path = "../zsql-mssql" }
zsql-mysql = { path = "../zsql-mysql" }
# The only other place in the workspace allowed to depend on `zsql-ssh`
# beyond the crate itself: `session.rs` drives `open_tunnel` to set up a
# tunnel before `drivers::connect`, but never names a tokio or russh type --
# only `zsql_ssh`'s own public surface (`SshConfig`, `SshTunnel`, `SshError`).
zsql-ssh = { path = "../zsql-ssh" }
zsql-ui = { path = "../zsql-ui" }
zsql-editor = { path = "../zsql-editor" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
dirs = { workspace = true }
chrono = { workspace = true }
gpui = { workspace = true }
flume = { workspace = true }
# `Session`'s liveliness probe races `Connection::ping` against a timer via
# `futures::future::select` (no tokio runtime is available to provide a
# `tokio::time::timeout`).
futures = { workspace = true }
# `connections.rs`'s `ConnectionStoreError`.
thiserror = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
# Enables `gpui::test` / `TestAppContext` (gpui's headless, deterministic test
# harness) for the render-smoke test in `ui::results`. Unified with the
# `gpui` dependency above via Cargo's resolver, so this only takes effect for
# test/bench builds, not the shipped binary.
gpui = { workspace = true, features = ["test-support"] }
# Only used by `session.rs`'s test-only `FakeConnection`, to implement
# `zsql_core::Connection` without pulling in a real driver.
async-trait = { workspace = true }
# Exposes `EditorView`'s test-only accessors so the adapter/live tests can
# drive an editor entity directly, without reaching into its private fields.
zsql-editor = { path = "../zsql-editor", features = ["test-support"] }
# Exposes `zsql_ui::scrollable`'s scrollbar-thumb debug-selector helpers, so
# `sidebar.rs`'s own render tests can locate a thumb via
# `VisualTestContext::debug_bounds` without duplicating the selector format.
zsql-ui = { path = "../zsql-ui", features = ["test-support"] }

[lints]
workspace = true

[features]
# Gates `session.rs`'s `ssh_live_tests` module: a dockerized sshd tunneling
# to real Postgres/MySQL/MSSQL databases, following the same pattern as
# `zsql-postgres`/`zsql-mssql`/`zsql-mysql`'s own `driver-integration-tests`
# and `zsql-ssh`'s `ssh-integration-tests`. See `scripts/ssh-dev.sh`. Enables
# `zsql-ssh`'s matching feature too, so `ssh_live_tests` can draw fixture
# defaults from `zsql_ssh::test_fixtures` instead of restating them.
ssh-integration-tests = ["zsql-ssh/ssh-integration-tests"]
# Gates `database_switch_live_tests`: `Session::switch_database` exercised
# against a real Postgres server, following the same pattern as
# `ssh-integration-tests` above and `zsql-postgres`'s own
# `driver-integration-tests`. See `scripts/pg-dev.sh`.
driver-integration-tests = []

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "zsql"
version = "0.1.0"
identifier = "com.tristonj.zsql"
out-dir = "../../target/package"
description = "A lightweight, developer-focused SQL editor"
homepage = "https://github.com/TristonJ/zsql"
license-file = "../../LICENSE"
category = "DeveloperTool"
icons = ["icons/*"]
