[package]
name = "zsql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "zsql"

[[bin]]
name = "zsql"
path = "src/main.rs"

[dependencies]
zsql-core = { path = "../zsql-core" }
# `Session` (session.rs) connects and runs queries through this: it is the
# only place in this crate that names a Postgres/sqlx type, and even there
# only behind `zsql_core::Connection`/`CoreError` — see `session.rs`'s module
# doc comment.
zsql-postgres = { path = "../zsql-postgres" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
gpui = { workspace = true }
flume = { workspace = true }

[dev-dependencies]
# Enables `gpui::test` / `TestAppContext` (gpui's headless, deterministic test
# harness) for the render-smoke test in `ui::results`. Unified with the
# `gpui` dependency above via Cargo's resolver, so this only takes effect for
# test/bench builds, not the shipped binary.
gpui = { workspace = true, features = ["test-support"] }
# Only used by `session.rs`'s test-only `FakeConnection`, to implement
# `zsql_core::Connection` without pulling in a real driver.
async-trait = { workspace = true }

[lints]
workspace = true
