[package]
name = "zsql-mssql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zsql-core = { path = "../zsql-core" }
# tiberius is the standard async MSSQL (TDS) client for Rust. sqlx has no
# MSSQL backend, so this driver talks TDS directly instead of going through
# sqlx like zsql-postgres/zsql-sqlite do.
#
# Feature selection keeps this off tokio entirely: `rustls` pulls in
# tokio-rustls/tokio-util purely as an internal trait-adapter tiberius uses
# to bridge its generic `AsyncRead`/`AsyncWrite` stream into the TLS
# handshake -- neither requires a `tokio::runtime::Runtime` to be
# constructed, and the actual socket (`async-net`, below) is driven entirely
# by the smol/async-io reactor this workspace already runs on.
# `sql-browser-tokio`/`native-tls` and any tokio-runtime-pulling feature are
# deliberately left off.
tiberius = { version = "0.12", default-features = false, features = [
    "tds73",
    "rustls",
    "chrono",
] }
# TCP transport for tiberius's `Client::connect`, built on async-io/smol's
# reactor rather than tokio's.
async-net = "2"
# `Timer::after`, used to bound the connect handshake so a black-hole host
# cannot hang a fresh client forever. Same async-io reactor as async-net.
async-io = "2"
async-trait = { workspace = true }
async-global-executor = { workspace = true }
tracing = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
