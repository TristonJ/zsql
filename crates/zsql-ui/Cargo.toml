[package]
name = "zsql-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui = { workspace = true }
tracing = { workspace = true }
# `theme::Colors` derives `Deserialize` so a theme file on disk can override
# individual color roles.
serde = { workspace = true }

[features]
# Exposes scrollbar-thumb debug tagging (`VisualTestContext::debug_bounds`
# lookup keys) outside this crate's own `#[cfg(test)]` build, matching
# `zsql-editor`'s `test-support` pattern, so a consumer crate's own render
# tests can assert a scrollbar thumb's painted position. Enabled only as a
# dev-dependency feature, never reaching a shipped build.
test-support = []

[dev-dependencies]
# Enables `gpui::test` / `TestAppContext` (gpui's headless, deterministic test
# harness) for `TextField`'s behavior tests. Unified with the `gpui`
# dependency above via Cargo's resolver, so this only takes effect for
# test/bench builds.
gpui = { workspace = true, features = ["test-support"] }
# Exercises `theme::Colors`'s `Deserialize` impl against real JSON text in
# tests; the shipped crate never parses JSON itself.
serde_json = { workspace = true }

[[example]]
name = "text_field_demo"

[[example]]
name = "scrollable_demo"

[[example]]
name = "table_demo"

[lints]
workspace = true
